name: build-arm64

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross C compiler (for bundled SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar czf "../../../srl-${GITHUB_REF_NAME}-aarch64-linux-gnu.tar.gz" srl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: srl-aarch64-linux-gnu
          path: target/aarch64-unknown-linux-gnu/release/srl

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: srl-*-aarch64-linux-gnu.tar.gz
          body: |
            ARM64 (aarch64) Linux 构建。

            使用：解压后 `chmod +x srl && ./srl`。
            中文显示需 `sudo apt install fonts-noto-cjk`。
            教程见仓库 TUTORIAL.md。
